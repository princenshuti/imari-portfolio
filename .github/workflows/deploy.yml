name: Deploy to cPanel (imaliai.maxventures.rw)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run i18n:audit
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # VITE_ANTHROPIC_KEY is intentionally NOT passed.
          # The Anthropic key lives in the Supabase Edge Function `ai-proxy` (server-side).

      # Upload the built dist/ to the cPanel subdomain document root over FTP(S).
      # Requires repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
      # and (optional) variable CPANEL_DIR — the document root for the subdomain,
      # relative to the FTP user's home (default: imali.princenshuti.com/).
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.CPANEL_DIR || 'imali.princenshuti.com/' }}
          # Don't wipe files the build doesn't manage (e.g. cPanel-generated cgi-bin).
          dangerous-clean-slate: false
