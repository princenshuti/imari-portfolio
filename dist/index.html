      // marketing page, so painting the cream app background first flashes
      // on slow connections. App.jsx clears this once React takes over.

        try {
          var signedIn = Object.keys(localStorage).some(function (k) {
            return k.indexOf('sb-') === 0 && k.indexOf('-auth-token') !== -1;

          var pref = localStorage.getItem('imari:theme');
          var dark = pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!signedIn && dark) {
            document.body.style.background = '#0B100D';

        } catch (e) { /* storage unavailable — keep default */ }
